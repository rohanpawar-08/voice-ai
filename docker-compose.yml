services:
  redis:
    image: redis:alpine
    container_name: voice_copilot_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: voicedesk_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: voicedesk
      POSTGRES_USER: voicedesk
      POSTGRES_PASSWORD: voicedesk_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicedesk -d voicedesk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  postgres_data:
